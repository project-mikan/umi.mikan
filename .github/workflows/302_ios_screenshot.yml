name: 【iOS】Screenshots

# 撮影は遅いため、単体テスト（301）の待ち時間に影響しないよう別 workflow にしている
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/302_ios_screenshot.yml"
      - ".github/scripts/ios-screenshot-comment.sh"

concurrency:
  group: ios-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    # 1台のランナーで複数シミュレータを動かすとメモリ不足でテスト準備に数分かかったため、端末ごとにランナーを分ける
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            runner: macos-26
          - device: ipad
            runner: macos-26
          # iPhone Duo のため Xcode 27.1 が要る。イメージは preview（actions/runner-images#14404）なので macos-27 が GA したら移行
          - device: iphone-duo
            runner: xcode-27
            xcode: /Applications/Xcode_27.1.app
    name: screenshot (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # スクリーンショット画像を ios-screenshots ブランチへ push する
      pull-requests: write # スクリーンショットを PR にコメントする

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        if: matrix.xcode
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      # 301_ios_test.yml とキーを揃えて main で温めたキャッシュを使う
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/umi.mikan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # mtime や絶対パスに依存しない内容ベースのコンパイルキャッシュ。重い依存パッケージの分は Package.resolved が同じ限り使い回せる
      - name: Cache compilation
        uses: actions/cache@v6
        with:
          path: ios/CompilationCache
          key: ${{ matrix.runner }}-compilation-cache-${{ hashFiles('ios/umi.mikan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ matrix.runner }}-compilation-cache-

      - name: Capture screenshots
        env:
          SPM_CACHE_DIR: ios/SourcePackages
          COMPILATION_CACHE_DIR: ios/CompilationCache
        run: ios/scripts/capture-screenshots.sh "$RUNNER_TEMP/ios-screenshots" "${{ matrix.device }}"

      # 一部の撮影が失敗しても撮れた分は見られるようにする
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots-${{ matrix.device }}
          path: ${{ runner.temp }}/ios-screenshots/*.png
          if-no-files-found: ignore

      # フォークからの PR はトークンに書き込み権限がない
      - name: Comment screenshots on PR
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ios-screenshot-comment.sh "$RUNNER_TEMP/ios-screenshots"
