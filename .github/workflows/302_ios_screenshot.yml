name: 【iOS】Screenshots

# PR 上で人間が見た目を確認するためのスクリーンショットを撮影してコメントする（合否判定はしない）。
# 単体テスト（301_ios_test.yml）とは別 workflow にして並行実行し、テスト結果の待ち時間に影響させない。
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/302_ios_screenshot.yml"
      - ".github/scripts/ios-screenshot-comment.sh"

# 同じ PR へ連続 push した場合は古い撮影を止める（高コストな macos ランナーの無駄撃ちを防ぐ）
concurrency:
  group: ios-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: macos-26
    permissions:
      contents: write # スクリーンショット画像を ios-screenshots ブランチへ push する
      pull-requests: write # スクリーンショットを PR にコメントする

    steps:
      - uses: actions/checkout@v7

      # 301_ios_test.yml と同じ SPM 依存のキャッシュを共有する（キーが同じなので main で温めたものが使われる）
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/umi.mikan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # シミュレータ起動・ビルド・2台同時撮影はスクリプト内で行う（`make ios-screenshot` と同じ手順）
      - name: Capture screenshots
        env:
          SPM_CACHE_DIR: ios/SourcePackages
        run: ios/scripts/capture-screenshots.sh "$RUNNER_TEMP/ios-screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/ios-screenshots/*.png

      # フォーク元からの PR はトークンに書き込み権限がないため、artifact のみとしコメントはしない
      - name: Comment screenshots on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ios-screenshot-comment.sh "$RUNNER_TEMP/ios-screenshots"
