syntax = "proto3";

package user;

option go_package = "github.com/project-mikan/umi.mikan/backend/infrastructure/grpc";

// UserService はユーザー設定とアカウント管理を提供するサービスです。
// ユーザー情報の更新、AI機能の有効化、自動要約設定、Pub/Subメトリクス取得などの機能があります。
service UserService {
  // UpdateUserName はユーザー名を変更します。
  //
  // 例:
  //   request: { new_name: "新しい名前" }
  //   response: { success: true, message: "ユーザー名を更新しました" }
  //
  // エラー:
  //   - InvalidArgument: 名前が空
  //   - Internal: データベースエラー
  rpc UpdateUserName(UpdateUserNameRequest) returns (UpdateUserNameResponse);

  // ChangePassword は現在のパスワードを検証して新しいパスワードに変更します。
  //
  // 例:
  //   request: { current_password: "old123", new_password: "new456" }
  //   response: { success: true, message: "パスワードを変更しました" }
  //
  // エラー:
  //   - Unauthenticated: 現在のパスワードが不正
  //   - InvalidArgument: 新しいパスワードが短すぎる
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // EnableLLM はユーザーのAI機能（要約・ハイライト・意味的検索など）を有効化（オプトイン）します。
  // LLMは共通GCPプロジェクトのVertex AI経由で呼び出すため、ユーザーがAPIキーを用意する必要はありません。
  // 現在はGemini (llm_provider=1) のみ対応しています。既に有効な場合は何もせず成功を返します。
  //
  // 例:
  //   request: { llm_provider: 1 }
  //   response: { success: true, message: "llmEnabled" }
  //
  // エラー:
  //   - InvalidArgument: プロバイダーが不正
  rpc EnableLLM(EnableLLMRequest) returns (EnableLLMResponse);

  // GetUserInfo はユーザーの基本情報とAI機能設定を取得します。
  //
  // 例:
  //   request: {}
  //   response: { name: "太郎", email: "user@example.com", llm_settings: [{ llm_provider: 1, ... }] }
  //
  // エラー:
  //   - NotFound: ユーザーが存在しない（通常発生しない、認証済みのため）
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);

  // DisableLLM はユーザーのAI機能を無効化（オプトアウト）します。自動要約などの設定も削除されます。
  //
  // 例:
  //   request: { llm_provider: 1 }
  //   response: { success: true, message: "llmDisabled" }
  //
  // エラー:
  //   - NotFound: 指定されたプロバイダーのAI機能が有効化されていない
  rpc DisableLLM(DisableLLMRequest) returns (DisableLLMResponse);

  // DeleteAccount はユーザーアカウントと関連データを完全に削除します。
  // 日記、エンティティ、要約など全てのデータがカスケード削除されます。
  //
  // 例:
  //   request: {}
  //   response: { success: true, message: "アカウントを削除しました" }
  //
  // エラー:
  //   - Internal: 削除処理エラー
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // UpdateAutoSummarySettings は自動要約生成の設定を更新します。
  // 月次要約を有効/無効にできます。
  //
  // 例:
  //   request: { llm_provider: 1, auto_summary_monthly: false }
  //   response: { success: true, message: "自動要約設定を更新しました" }
  //
  // エラー:
  //   - NotFound: AI機能が有効化されていない
  rpc UpdateAutoSummarySettings(UpdateAutoSummarySettingsRequest) returns (UpdateAutoSummarySettingsResponse);

  // GetAutoSummarySettings は自動要約生成の現在の設定を取得します。
  //
  // 例:
  //   request: { llm_provider: 1 }
  //   response: { auto_summary_monthly: false }
  //
  // エラー:
  //   - NotFound: AI機能が有効化されていない
  rpc GetAutoSummarySettings(GetAutoSummarySettingsRequest) returns (GetAutoSummarySettingsResponse);

  // GetPubSubMetrics はRedis Pub/Subによる要約生成タスクの処理状況を取得します。
  // 過去24時間の時間別メトリクス、現在処理中のタスク、統計情報が含まれます。
  //
  // 例:
  //   request: {}
  //   response: { hourly_metrics: [...], processing_tasks: [...], summary: { total_daily_summaries: 10, ... } }
  //
  // エラー: なし（データがない場合は空配列）
  rpc GetPubSubMetrics(GetPubSubMetricsRequest) returns (GetPubSubMetricsResponse);

  // CreateApiKey はMCPサーバーなど外部クライアント向けのAPIキーを発行します。
  // キー本体はレスポンスで一度だけ返され、サーバーにはハッシュのみ保存されます。
  //
  // 例:
  //   request: { name: "Claude Desktop" }
  //   response: { api_key: "umi_...", info: { id: "...", name: "Claude Desktop", key_prefix: "umi_a1b2c3d4", ... } }
  //
  // エラー:
  //   - InvalidArgument: 名前が空または長すぎる
  //   - Internal: データベースエラー
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);

  // ListApiKeys は発行済みAPIキーの一覧を返します（キー本体は含まれません）。
  //
  // 例:
  //   request: {}
  //   response: { api_keys: [{ id: "...", name: "Claude Desktop", key_prefix: "umi_a1b2c3d4", ... }] }
  //
  // エラー: なし（キーがない場合は空配列）
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);

  // DeleteApiKey は指定されたAPIキーを失効させます。
  //
  // 例:
  //   request: { id: "..." }
  //   response: { success: true, message: "APIキーを削除しました" }
  //
  // エラー:
  //   - NotFound: 指定されたキーが存在しない、または他ユーザーのキー
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse);
}

// ユーザー名更新用のリクエスト
message UpdateUserNameRequest {
  string new_name = 1;
}

// ユーザー名更新用のレスポンス
message UpdateUserNameResponse {
  bool success = 1;
  string message = 2;
}

// パスワード変更用のリクエスト
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

// パスワード変更用のレスポンス
message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

// AI機能有効化用のリクエスト
message EnableLLMRequest {
  int32 llm_provider = 1; // 1:Gemini
  reserved 2; // 旧: key（ユーザー個別のAPIキーは廃止）
}

// AI機能有効化用のレスポンス
message EnableLLMResponse {
  bool success = 1;
  string message = 2;
}

// ユーザー情報取得用のリクエスト
message GetUserInfoRequest {
  // 空のリクエスト（認証はヘッダーから）
}

// ユーザー情報取得用のレスポンス
message GetUserInfoResponse {
  string name = 1;
  string email = 2;
  // AI機能設定（有効化されている場合のみ）
  repeated LLMSettingInfo llm_settings = 3;
}

// AI機能設定情報
message LLMSettingInfo {
  int32 llm_provider = 1; // 1:Gemini
  reserved 2; // 旧: key（ユーザー個別のAPIキーは廃止）
  bool auto_summary_monthly = 4; // 月毎の自動要約生成
  bool auto_latest_trend_enabled = 5; // 直近トレンド分析の自動生成
  bool semantic_search_enabled = 6; // 意味的検索（RAG）機能の有効化
}

// AI機能無効化用のリクエスト
message DisableLLMRequest {
  int32 llm_provider = 1; // 1:Gemini
}

// AI機能無効化用のレスポンス
message DisableLLMResponse {
  bool success = 1;
  string message = 2;
}

// アカウント削除用のリクエスト
message DeleteAccountRequest {
  // 空のリクエスト（認証はヘッダーから）
}

// アカウント削除用のレスポンス
message DeleteAccountResponse {
  bool success = 1;
  string message = 2;
}

// 自動要約設定更新用のリクエスト
message UpdateAutoSummarySettingsRequest {
  int32 llm_provider = 1; // 1:Gemini
  bool auto_summary_monthly = 3; // 月毎の自動要約生成
  bool auto_latest_trend_enabled = 4; // 直近トレンド分析の自動生成
  bool semantic_search_enabled = 5; // 意味的検索（RAG）機能の有効化
}

// 自動要約設定更新用のレスポンス
message UpdateAutoSummarySettingsResponse {
  bool success = 1;
  string message = 2;
}

// 自動要約設定取得用のリクエスト
message GetAutoSummarySettingsRequest {
  int32 llm_provider = 1; // 1:Gemini
}

// 自動要約設定取得用のレスポンス
message GetAutoSummarySettingsResponse {
  bool auto_summary_monthly = 2; // 月毎の自動要約生成
  bool auto_latest_trend_enabled = 3; // 直近トレンド分析の自動生成
  bool semantic_search_enabled = 4; // 意味的検索（RAG）機能の有効化
}

// Pub/Subメトリクス取得用のリクエスト
message GetPubSubMetricsRequest {
  // 空のリクエスト（認証はヘッダーから）
}

// Pub/Subメトリクス取得用のレスポンス
message GetPubSubMetricsResponse {
  // 過去24時間の処理状況
  repeated HourlyMetrics hourly_metrics = 1;
  // 処理中のタスク
  repeated ProcessingTask processing_tasks = 2;
  // 統計情報
  MetricsSummary summary = 3;
}

// 1時間ごとのメトリクス
message HourlyMetrics {
  int64 timestamp = 1; // 該当時間のUnixタイムスタンプ
  int32 monthly_summaries_processed = 3; // 処理された月次要約数
  int32 monthly_summaries_failed = 5; // 失敗した月次要約数
  int32 latest_trends_processed = 6; // 処理されたトレンド分析数
  int32 latest_trends_failed = 7; // 失敗したトレンド分析数
  int32 diary_embeddings_processed = 8; // 処理されたembedding数
  int32 diary_embeddings_failed = 9; // 失敗したembedding数
  int32 semantic_searches_processed = 10; // 意味的検索のAIリクエスト数
}

// 処理中のタスク
message ProcessingTask {
  string task_type = 1; // タスク種別: "monthly_summary" (月次要約), "latest_trend" (トレンド分析)
  string date = 2; // 日付: 月次はYYYY-MM形式, トレンドは期間説明
  int64 started_at = 3; // タスク開始時刻 (Unixタイムスタンプ)
}

// メトリクス統計情報
message MetricsSummary {
  int32 total_monthly_summaries = 2; // 総月次要約数
  int32 pending_monthly_summaries = 4; // 未作成の月次要約数
  bool auto_summary_monthly_enabled = 6; // 月次要約の自動生成が有効か
  bool auto_latest_trend_enabled = 7; // トレンド分析の自動生成が有効か
  string latest_trend_generated_at = 8; // 最後にトレンド分析が生成された日時 (ISO 8601形式)
  bool semantic_search_enabled = 9; // 意味的検索（RAG）が有効か
  int32 total_embeddings = 10; // 生成済みのembeddingチャンク数
  int32 pending_embeddings = 11; // 未生成のembedding数（日記数 - embedding済み日記数）
  int32 total_embedding_diaries = 12; // embedding生成済みの日記数
}
// APIキー情報（キー本体は含まない）
message ApiKeyInfo {
  string id = 1;
  string name = 2; // キーの用途を示すラベル
  string key_prefix = 3; // 一覧表示用のキー先頭部分（例: umi_a1b2c3d4）
  int64 last_used_at = 4; // 最終使用日時（Unix秒、未使用の場合は0）
  int64 created_at = 5;
  int64 expires_at = 6; // 有効期限（Unix秒）
}

// APIキー発行用のリクエスト
message CreateApiKeyRequest {
  string name = 1; // キーの用途を示すラベル
}

// APIキー発行用のレスポンス
message CreateApiKeyResponse {
  string api_key = 1; // キー本体（この発行時にのみ返される）
  ApiKeyInfo info = 2;
}

// APIキー一覧取得用のリクエスト
message ListApiKeysRequest {
  // 空のリクエスト（認証はヘッダーから）
}

// APIキー一覧取得用のレスポンス
message ListApiKeysResponse {
  repeated ApiKeyInfo api_keys = 1;
}

// APIキー削除用のリクエスト
message DeleteApiKeyRequest {
  string id = 1;
}

// APIキー削除用のレスポンス
message DeleteApiKeyResponse {
  bool success = 1;
  string message = 2;
}
